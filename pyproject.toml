[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-synth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
logic-synth = "logic_synth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]